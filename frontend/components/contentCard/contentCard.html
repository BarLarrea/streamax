<article
    class="content-card"
    tabindex="0"
>
    <div class="thumb">
        <img
            class="poster"
            src=""
            alt=""
            loading="lazy"
        />
        <div class="overlay">
            <div class="meta">
                <span class="type-pill"></span>
                <h3 class="title"></h3>
                <p class="desc"></p>
                <button class="card-btn continue-btn hidden">▶ Continue</button>
            </div>

        <span class="type"></span>

    <div class="progress hidden">
        <div class="bar"></div>
    </div>
</article>
