<div class="profile">
    <img
        id="profile-avatar"
        class="profile-avatar"
        src="assets/profile/avatar0.png"
        alt="Profile"
    />

    <div
        id="profile-dropdown"
        class="profile-dropdown"
    >
        <!-- Switch Profile Section -->
        <div class="dropdown-section">
            <p class="dropdown-title">Switch Profile</p>
            <div
                id="profile-switch-list"
                class="profile-switch-list"
            ></div>
        </div>

        <!-- Go to Profile Management -->
        <button
            id="manage-profiles-btn"
            class="dropdown-item"
        >
            Manage Profiles
        </button>

        <!-- Logout -->
        <button
            id="logout-btn"
            class="dropdown-item logout-btn"
        >
            <i class="bi bi-box-arrow-right logout-icon"></i>
            Logout
        </button>
    </div>
</div>
