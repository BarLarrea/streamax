<section
    class="auth"
    data-page="login"
>
    <header class="auth__header">
        <div class="auth__kicker">Welcome to</div>
        <h1 class="auth__title">
            <span class="brand-logo brand-logo--xl">StreaMax</span>
        </h1>
        <p class="auth__subtitle">
            Discover, watch, and enjoy your favorite movies and series all in
            one place.
        </p>
    </header>

    <div class="auth__card">
        <h2>Please log in to continue</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="userName">User Name</label>
                <input
                    id="userName"
                    type="text"
                    placeholder="Enter your user name"
                    required
                />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                />
            </div>
            <button
                class="btn"
                type="submit"
            >
                Log In
            </button>
            <p class="auth__link">
                Don't have an account? <a href="#/register">Sign Up</a>
            </p>
        </form>
    </div>
</section>
