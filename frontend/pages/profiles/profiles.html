<section
    class="profiles"
    data-page="profiles"
>
    <header class="profiles-header">
        <h1 id="user-greeting">Hello</h1>
        <h2 class="profiles-kicker">Who is watching?</h2>
    </header>

    <div
        class="profiles-list"
        id="profiles-list"
    >
        <div class="profile-card">
            <button
                class="edit-profile-btn"
                title="Edit Profile"
            >
                <i class="bi bi-pencil"></i>
            </button>
            <img
                src="assets/profile/avatar1.png"
                alt="Profile avatar"
                class="profile-avatar"
            />
            <p class="profile-name">Bar</p>
        </div>

        <div class="profile-card">
            <button
                class="edit-profile-btn"
                title="Edit Profile"
            >
                <i class="bi bi-pencil"></i>
            </button>
            <img
                src="assets/profile/avatar2.png"
                alt="Profile avatar"
                class="profile-avatar"
            />
            <p class="profile-name">Noa</p>
        </div>

        <div class="profile-card add-profile">
            <div class="add-icon">+</div>
            <p class="profile-name">Add Profile</p>
        </div>
    </div>
    <div class="profiles-footer">
        <button
            id="toggle-edit-mode"
            class="toggle-edit-btn"
        >
            Edit Profiles
        </button>
    </div>
</section>
